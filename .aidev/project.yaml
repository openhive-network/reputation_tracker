# Profile for hive/reputation_tracker, written by `aidev project scaffold` (#13561).
#
# Schema reference: docs/architecture/project-profile.md
# Onboarding procedure: the `onboard-external-project` skill.
# Guide: docs/operations/onboarding-an-external-project.md
#
# The generator writes a starting point, not a governed answer: every
# binding below is the command a maintainer said this project runs, and it
# is reviewed and edited like any other declaration.
version: 2
project: reputation-tracker

gitlab:
  host: "gitlab.syncad.com"
  path: "hive/reputation_tracker"
  id: 418

# AIDEV integrates into its own branch; people merge it into develop through
# merge requests (as in hive/HAfAH and hive/balance_tracker), so `stable` is
# omitted and `aidev release` never moves develop or master.
branches:
  integration: "aidev/integration"
  # Integration reaches develop only by merge request gated by the project CI (aidev handoff).
  handoff: develop

# How this project's suites execute (#13892): one kind, stated once.
environment:
  kind: "container"
  # The suites run in .aidev/runtime/Dockerfile built on common-ci-configuration's
  # haf-app-test-runner, the image CI's tavern jobs run in; AIDEV rebuilds it when
  # the followed tag moves, so tool versions come from that image. `image` is the
  # seed pin consumers read before a slot is resolved: the base's digest at
  # adoption. See .aidev/README.md.
  image: "registry.gitlab.syncad.com/hive/common-ci-configuration/haf-app-test-runner@sha256:a24c816d6defc38d58bd38246dc1afa4530b416e7fe8dd77b3cdf7c645eb0e7c"
  inputs: [".aidev/runtime/Dockerfile"]
  build: {dockerfile: ".aidev/runtime/Dockerfile", context: "."}
  base: {image: "registry.gitlab.syncad.com/hive/common-ci-configuration/haf-app-test-runner:develop", follow: true}

issues:
  intake_label: todo
  taxonomy: ".aidev/labels.yaml"
  decompose:
    # `never` is where an external project starts: nothing marks work
    # approved on this project's behalf until there is a track record.
    auto_todo: never
  # Reports about this project's work are filed against this project.
  watcher_reports: self

# The slots that install the reputation tracker (every one without `stack: false`)
# reach the shared HAF the `haf` project hosts (a HAF replayed to block 5000000)
# as AIDEV_EXTERNAL_HAF_HOST/_PORT. .aidev/run-checks.sh takes a copy-on-write
# clone of it per run, installs the candidate's own SQL into the clone, syncs the
# candidate's block processing over the clone's 5M blocks and drops the clone on
# exit, so no data is copied and no image is built. The consumer role is trusted
# from the fleet LAN: no secret. See .aidev/README.md.
sandbox:
  external:
    - name: haf
      provider: "haf/haf"

# Verification slots. Each binding is what this project genuinely runs for
# that slot — never one selection repeated under seven names, which makes
# seven gates report on the same evidence while claiming to check seven
# different things.
#
# Lightweight first: lint, then install of the candidate's SQL into a clone of
# the shared 5M-block HAF, its block processing to block 5000000, CI's
# regression test (every account's reputation against hived's), the tavern
# pattern tests (CI's pattern-test), and for full and canary an upgrade in
# place and an uninstall followed by a fresh install (CI's setup-scripts-test).
# CI's JMeter benchmarks and python api client tests aren't bound; see
# .aidev/README.md.
verification:
  quick:
    adapter: command
    args: [".aidev/run-checks.sh", "quick", "shellcheck", "sql-registered"]
    stack: false
    artifacts: ["test-results/quick/"]
  full:
    adapter: command
    args: [".aidev/run-checks.sh", "full", "shellcheck", "sql-registered", "install", "sync", "regression", "tavern", "reinstall", "uninstall"]
    artifacts: ["test-results/full/"]
  baseline:
    adapter: command
    args: [".aidev/run-checks.sh", "baseline", "install", "sync", "regression", "tavern"]
    artifacts: ["test-results/baseline/"]
  canary:
    adapter: command
    args: [".aidev/run-checks.sh", "canary", "shellcheck", "sql-registered", "install", "sync", "regression", "tavern", "reinstall", "uninstall"]
    artifacts: ["test-results/canary/"]
  # There is no coverage measurement for SQL; `coverage` runs the tree-wide checks
  # (AIDEV runs it in the post-implementation scan only). `static` and `system`
  # are left unbound: AIDEV runs neither for a project.
  coverage:
    adapter: command
    args: [".aidev/run-checks.sh", "coverage", "shellcheck", "sql-registered"]
    stack: false
    artifacts: ["test-results/coverage/"]

capabilities: []
